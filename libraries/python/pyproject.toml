[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smcp-security"
version = "1.0.0"
description = "Secure Model Context Protocol (SMCP) v1 — Production-ready security framework for MCP implementations"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Cecil Jentges", email = "cecil.jentges@gmail.com" }
]
requires-python = ">=3.9"
keywords = [
    "security", "mcp", "model-context-protocol", "ai", "authentication",
    "authorization", "validation", "middleware", "threat-detection",
    "ai-security", "cybersecurity", "cnsa", "zero-trust"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.0",
    "pyotp>=2.9.0",
    "jsonschema>=4.20.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
]
qr = [
    "qrcode>=7.4.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-benchmark>=4.0.0",
    "faker>=20.0.0",
    "black>=23.10.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "bandit>=1.7.5",
]
all = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "qrcode>=7.4.0",
]

[project.urls]
Homepage    = "https://github.com/wizardscurtain/SMCPv1"
Repository  = "https://github.com/wizardscurtain/SMCPv1"
"Bug Tracker" = "https://github.com/wizardscurtain/SMCPv1/issues"

[project.scripts]
smcp-security = "smcp_security.cli:main"

# ---------------------------------------------------------------------------
# Setuptools
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["smcp_security*"]

[tool.setuptools.package-data]
smcp_security = ["py.typed"]

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
addopts      = [
    "--verbose",
    "--cov=smcp_security",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["smcp_security"]
omit   = ["*/tests/*", "*/test_*"]

# ---------------------------------------------------------------------------
# Code quality
# ---------------------------------------------------------------------------
[tool.black]
line-length    = 88
target-version = ["py39"]

[tool.isort]
profile     = "black"
line_length = 88

[tool.mypy]
python_version      = "3.9"
warn_return_any     = true
warn_unused_configs = true
disallow_untyped_defs = true
