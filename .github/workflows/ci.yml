name: CI

on:
  push:
    branches: ["main", "hardening/**", "feat/**", "fix/**"]
    paths:
      - "libraries/python/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "libraries/python/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Python test matrix
  # ------------------------------------------------------------------
  test-python:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: libraries/python

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          # Also smoke-test on Windows and macOS with the latest Python
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (black --check)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: black --check smcp_security/

      - name: Run tests
        run: |
          pytest tests/ \
            --asyncio-mode=auto \
            --tb=short \
            -q \
            --no-header \
            --cov=smcp_security \
            --cov-report=xml \
            --cov-report=term-missing \
            --benchmark-disable

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: libraries/python/coverage.xml
          flags: python
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # Package build check — verifies the wheel builds cleanly
  # ------------------------------------------------------------------
  build-python:
    name: "Build Python wheel"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/python
    needs: test-python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: libraries/python/dist/
          retention-days: 7

  # ------------------------------------------------------------------
  # Security scan
  # ------------------------------------------------------------------
  security-scan:
    name: "Security scan (bandit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: |
          bandit -r smcp_security/ \
            -ll \
            --exclude smcp_security/cli.py \
            -f json \
            -o bandit-report.json || true
          # Surface the report but don't hard-fail CI on low/medium findings —
          # high-severity findings are surfaced as annotations
          bandit -r smcp_security/ \
            -lll \
            --exclude smcp_security/cli.py
