name: Publish Python package to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Show version
        run: |
          python - <<'PY'
          import tomllib, pathlib, sys
          p = pathlib.Path('libraries/python/pyproject.toml')
          d = tomllib.load(open(p,'rb'))
          if 'project' in d:
              name = d['project'].get('name')
              version = d['project'].get('version')
          elif 'tool' in d and 'poetry' in d['tool']:
              name = d['tool']['poetry'].get('name')
              version = d['tool']['poetry'].get('version')
          else:
              print('Unable to determine package name/version from pyproject', file=sys.stderr)
              sys.exit(1)
          print('Will publish', name, version)
          PY

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          chmod +x ./scripts/publish-python.sh
          ./scripts/publish-python.sh
