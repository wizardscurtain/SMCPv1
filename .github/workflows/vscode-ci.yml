name: CI - VS Code Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        working-directory: libraries/vscode-extension
        run: |
          npm ci
      - name: Run tests
        working-directory: libraries/vscode-extension
        run: |
          npm test
