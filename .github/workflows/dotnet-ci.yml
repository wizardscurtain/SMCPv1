name: CI - .NET (C#)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Restore and Test
        working-directory: libraries/csharp
        run: |
          dotnet restore
          dotnet test --no-restore -v minimal
