name: CI - Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('**/pyproject.toml','code/requirements-test.txt') }}
          restore-keys: ${{ runner.os }}-pip-test-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements-test.txt
          pip install -e ./code

      - name: Run tests (pytest)
        working-directory: code
        run: |
          pytest -v --junit-xml=test-results.xml --cov=smcp_security --cov-report=xml --cov-report=term-missing

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: |
            code/test-results.xml
            code/coverage.xml
            code/htmlcov

      - name: Annotate failing tests
        if: failure()
        run: echo "One or more checks failed; see uploaded artifacts for details"

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip (lint)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml','code/requirements-lint.txt') }}
          restore-keys: ${{ runner.os }}-pip-lint-

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements-lint.txt

      - name: Black (check)
        run: |
          black --check code

      - name: Isort (check)
        run: |
          isort --check-only --diff code

      - name: Flake8
        run: |
          flake8 code

      - name: Mypy
        run: |
          mypy --config-file code/pyproject.toml code/smcp_security || true

