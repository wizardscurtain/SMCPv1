[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smcp-security"
version = "1.0.0b1"  # Beta 1
description = "SMCP - Security framework for Model Context Protocol (MCP). Add 'HTTPS-like' security to MCP servers in 1-2 lines of code."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SMCP Security Team", email = "security@github.com"}
]
maintainers = [
    {name = "SMCP Security Team", email = "security@github.com"}
]
keywords = [
    "mcp",
    "security",
    "model-context-protocol",
    "ai-security",
    "command-injection",
    "prompt-injection",
    "authentication",
    "authorization",
    "rate-limiting",
    "audit-logging"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed"
]

dependencies = [
    # Core security dependencies
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.0",

    # Authentication
    "pyotp>=2.9.0",
    "qrcode>=7.4.0",

    # Validation
    "jsonschema>=4.20.0",
    "pydantic>=2.5.0",

    # Utilities
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
# Machine Learning for advanced threat detection
ml = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
]

# Full ML stack with transformers
ml-full = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "transformers>=4.35.0",
    "torch>=2.1.0",
]

# FastAPI integration
fastapi = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
]

# Async file operations
async = [
    "aiofiles>=23.2.0",
]

# All optional features
all = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
]

# Development dependencies
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "httpx>=0.25.0",
    "faker>=19.0.0",

    # Code quality
    "black>=23.10.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "isort>=5.12.0",

    # Security testing
    "bandit>=1.7.5",
    "safety>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/wizardscurtain/SMCPv1"
Documentation = "https://github.com/wizardscurtain/SMCPv1#readme"
Repository = "https://github.com/wizardscurtain/SMCPv1"
Issues = "https://github.com/wizardscurtain/SMCPv1/issues"
Changelog = "https://github.com/wizardscurtain/SMCPv1/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["smcp_security"]

[tool.setuptools.package-data]
smcp_security = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed for beta
disallow_incomplete_defs = false  # Relaxed for beta
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "numpy.*",
    "scipy.*",
    "joblib.*",
    "qrcode.*",
    "pyotp.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "slow: Slow tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["smcp_security"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.bandit]
exclude_dirs = ["tests"]
